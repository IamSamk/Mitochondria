name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emp
          POSTGRES_PASSWORD: emp_dev_password
          POSTGRES_DB: emp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://emp:emp_dev_password@localhost:5432/emp_test
      SESSION_SECRET: ci-only-session-secret
      CSRF_SECRET: ci-only-csrf-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
